services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projeto-frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: projeto-server
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev